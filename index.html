<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Record Sync to Spaceship</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input { background-color: #2d2d2d; color: white; border: 1px solid #404040; }
        input:focus { outline: none; border-color: #6366f1; }
    </style>
</head>
<body class="bg-[#1a1a1a] text-gray-300 font-sans p-8 min-h-screen">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- API Configuration Panel -->
        <div class="bg-[#242424] border border-[#333] rounded-lg p-6 flex gap-4 items-end">
            <div class="flex-1">
                <label class="block text-sm text-gray-400 mb-1">Target Domain</label>
                <input type="text" id="targetDomain" placeholder="e.g. example.com" class="w-full p-2 rounded text-sm">
            </div>
            <div>
                <input type="file" id="fileInput" accept=".txt,.csv" class="text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-[#333] file:text-white hover:file:bg-[#404040]">
            </div>
        </div>

        <!-- Preview Table -->
        <div class="bg-[#242424] border border-[#333] rounded-lg p-6">
            <h3 class="text-white font-medium mb-4">Parsed Records Preview</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead>
                        <tr class="text-gray-400 border-b border-[#333]">
                            <th class="pb-3 px-2 font-medium">Host</th>
                            <th class="pb-3 px-2 font-medium">Type</th>
                            <th class="pb-3 px-2 font-medium">Value</th>
                            <th class="pb-3 px-2 font-medium">Sync Status</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTableBody">
                        <!-- Rows populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let parsedRecords = [];

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                parseFileContent(text);
                
                if(document.getElementById('targetDomain').value) {
                    syncToBackend();
                } else {
                    alert("Please enter a Target Domain before uploading.");
                }
            };
            reader.readAsText(file);
        });

        function parseFileContent(text) {
            const lines = text.split('\n');
            parsedRecords = [];
            const tbody = document.getElementById('recordsTableBody');
            tbody.innerHTML = '';

            lines.forEach(line => {
                line = line.trim();
                if (!line || line.startsWith('#')) return;

                const parts = line.split(/\s+/);
                if (parts.length >= 3) {
                    const host = parts[0];
                    const type = parts[1];
                    const value = parts.slice(2).join(' ');
                    
                    parsedRecords.push({ host, type, value, ttl: 3600 });

                    const row = document.createElement('tr');
                    row.className = 'border-b border-[#333]';
                    row.innerHTML = `
                        <td class="py-3 px-2">${host}</td>
                        <td class="py-3 px-2"><span class="bg-[#333] px-2 py-1 rounded text-xs">${type}</span></td>
                        <td class="py-3 px-2 truncate max-w-xs" title="${value}">${value}</td>
                        <td class="py-3 px-2 text-yellow-500 status-cell">Pending</td>
                    `;
                    tbody.appendChild(row);
                }
            });
        }

        async function syncToBackend() {
            const domain = document.getElementById('targetDomain').value.trim();
            const statusCells = document.querySelectorAll('.status-cell');

            statusCells.forEach(cell => { cell.textContent = 'Syncing...'; cell.className = 'py-3 px-2 text-blue-400 status-cell'; });

            // Format records for Spaceship API schema
            const payloadRecords = parsedRecords.map(record => {
                let formattedRecord = { type: record.type.toUpperCase(), name: record.host, ttl: record.ttl };
                switch(formattedRecord.type) {
                    case 'A': case 'AAAA': formattedRecord.address = record.value; break;
                    case 'CNAME': formattedRecord.cname = record.value; break;
                    case 'MX': formattedRecord.exchange = record.value; formattedRecord.preference = 10; break;
                    case 'TXT': default: formattedRecord.value = record.value; break;
                }
                return formattedRecord;
            });

            try {
                // Send payload to local Node.js server instead of directly to Spaceship
                const response = await fetch(`http://localhost:3000/api/sync-dns`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain: domain, records: payloadRecords })
                });

                if (response.ok) {
                    statusCells.forEach(cell => { cell.textContent = 'Uploaded'; cell.className = 'py-3 px-2 text-green-500 status-cell'; });
                } else {
                    statusCells.forEach(cell => { cell.textContent = 'Failed'; cell.className = 'py-3 px-2 text-red-500 status-cell'; });
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                statusCells.forEach(cell => { cell.textContent = 'Error'; cell.className = 'py-3 px-2 text-red-500 status-cell'; });
            }
        }
    </script>
</body>
</html>
